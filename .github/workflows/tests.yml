name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API-тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Прогнать тесты
        run: mvn -B test

      - name: Сводка по прогону
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, tot, fail, err, skip = [], 0, 0, 0, 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              r = ET.parse(f).getroot()
              t = int(r.get('tests', 0)); fl = int(r.get('failures', 0))
              er = int(r.get('errors', 0)); sk = int(r.get('skipped', 0))
              tot += t; fail += fl; err += er; skip += sk
              rows.append((r.get('name', '?').split('.')[-1], t, fl + er, sk))
          print('### Результаты тестов\n')
          print('| Класс | Тестов | Упало | Пропущено |')
          print('|-------|-------:|------:|----------:|')
          for n, t, f_, s in rows:
              print(f'| `{n}` | {t} | {f_} | {s} |')
          print(f'| **Всего** | **{tot}** | **{fail + err}** | **{skip}** |')
          PY

      - name: Собрать отчёт Allure
        if: always()
        run: mvn -B allure:report

      - name: Сохранить отчёт как артефакт сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: error

      - name: Подготовить отчёт для GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    name: Опубликовать отчёт на GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Развернуть на Pages
        id: deployment
        uses: actions/deploy-pages@v4
